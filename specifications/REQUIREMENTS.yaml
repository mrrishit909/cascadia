requirements:
  # --- P0/P1 interaction requirements (source of truth: the Atlas's own execution contract) ---
  - id: CAS-INT-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-001"
    given: "baseline fixture (case30) loaded"
    when: "a user selects a substation and confirms removal"
    then: "the substation is marked unavailable, feasible service is recomputed via the island-aware DC-OPF, unserved load (MW) is shown from the solver output, an infeasible diagnostic is exposed when applicable, and undo restores the exact baseline"
    behavior: "Remove node"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:island_balance", "unit:n1_parity_sweep", "e2e:cas_substation_remove_keyboard"]
    status: implemented
    evidence_paths: []
  - id: CAS-INT-002
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-002"
    given: "baseline fixture loaded"
