requirements:
  # --- P0/P1 interaction requirements (source of truth: the Atlas's own execution contract) ---
  - id: CAS-INT-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-001"
    given: "baseline fixture (case30) loaded"
    when: "a user selects a substation and confirms removal"
    then: "the substation is marked unavailable, feasible service is recomputed via the island-aware DC-OPF, unserved load (MW) is shown from the solver output, an infeasible diagnostic is exposed when applicable, and undo restores the exact baseline"
    behavior: "Remove node"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:island_balance", "unit:n1_parity_sweep", "e2e:cas_substation_remove_keyboard"]
    status: independently verified
    evidence_paths: ["e2e/cas_substation_remove_keyboard.spec.ts", "e2e/concurrency.spec.ts", "src/app/resetAndInterrupt.test.tsx", "verification/D1_D2_INDEPENDENT_REVIEW.md"]
    note: "D1 (confirmed removal lost to a cross-control race) and N1 (allow_shed not honored) both found and fixed; independently re-verified by a separate adversarial-reviewer session that reproduced the original bugs against a pre-fix build to confirm its own harness, then confirmed neither reproduces on current code."
  - id: CAS-INT-002
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-002"
    given: "baseline fixture loaded"
    when: "a user raises load at a bus"
    then: "the dispatch LP is resolved, line thickness/color reflects the new flow, and infeasible load levels show a diagnostic instead of a silently-clamped number"
    behavior: "increase load"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:n1_parity_sweep", "unit:load_gen_sweep", "e2e:newControls.spec.ts"]
    status: implemented
    evidence_paths: ["src/app/newControls.test.tsx", "tests/unit/loadGenParity.test.ts", "verification/REFERENCE_RESULTS/load_gen_sweep.json", "e2e/newControls.spec.ts"]
    note: "40-case oracle sweep (8 forcing partial shed, including one cross-control case with CAS-INT-005) parity-verified against the TS Worker. Two real bugs found and fixed: a reintroduced N2-class draft-resync bug, and a select-then-slider race where an immediately-following slider edit could be silently reverted by the selection-change resync effect -- reproduced directly in ReduceGenerator.tsx (3/10 with real keyboard input, higher with scripted .fill()); the equivalent fix in IncreaseLoad.tsx was applied by analogy (same component pattern) and was not independently reproduced there. D1/N1 ordering and allowShed-threading also directly verified (e2e/newControls.spec.ts). Not yet independently reviewed."
  - id: CAS-INT-003
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-003"
    given: "baseline fixture loaded"
    when: "a user reduces a generator's output limit"
    then: "dispatch is recomputed and load-shed markers appear if the remaining capacity cannot serve demand"
    behavior: "reduce generator"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:n1_parity_sweep", "unit:load_gen_sweep", "e2e:newControls.spec.ts"]
    status: implemented
    evidence_paths: ["src/app/newControls.test.tsx", "tests/unit/loadGenParity.test.ts", "verification/REFERENCE_RESULTS/load_gen_sweep.json", "e2e/newControls.spec.ts"]
    note: "Same N2-class fix and sweep coverage as CAS-INT-002. The select-slider race was reproduced and fixed HERE (ReduceGenerator.tsx), not in IncreaseLoad.tsx -- see CAS-INT-002's note. Mutation-checked against the regression test's actual (not vacuous) shape: reverting the fix reproduced the race in 3/10 real-keyboard runs. Not yet independently reviewed."
  - id: CAS-INT-004
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-004"
    given: "baseline fixture loaded"
    when: "a user adds a new transmission line between two buses (from a labeled-synthetic candidate list)"
    then: "the graph is recomputed and new routing/flow is shown"
    behavior: "add line"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:add_line_restoration_parity", "e2e:addLine.spec.ts"]
    status: implemented
    evidence_paths: ["src/interactions/AddLine.tsx", "tests/unit/addLineRestorationParity.test.ts", "verification/REFERENCE_RESULTS/add_line_restoration.json", "e2e/addLine.spec.ts"]
    note: "Worker plumbing extended (LpRequest/lpClient/lpWorker/state.tsx) to carry the 5 SYNTHETIC candidate lines end to end, not just in the Python oracle/TS engine. 24-case oracle parity (add_line_restoration.json, part of the same file as INT-006's restoration ranking). Rendered in NetworkView.tsx as a distinct accent color, click/keyboard-toggleable directly from the SVG or the control's own list. A real bug found and fixed: the SVG toggle handler read confirmed-only state, so a second click while an add/remove was still in flight re-submitted the same direction instead of reversing it (mutation-checked: 10/10 fails pre-fix, 10/10 pass post-fix). e2e coverage: real-oracle-matched flow value, SVG round-trip, D2/topology/N1 (candidate 0 makes an infeasible bus-26 removal feasible, confirmed-state path only, not a genuine overlap race), reset-during-solve, N2-class (addedLines survives an unrelated solve), the SVG-toggle regression above. No dedicated D1 (genuine overlap) test yet for this control. Not yet independently reviewed."
  - id: CAS-INT-005
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-005"
    given: "baseline fixture loaded"
    when: "a user alters a line's thermal capacity"
    then: "the constraint-binding status is recalculated and affected edges are visually refreshed"
    behavior: "alter line capacity"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:n1_parity_sweep", "e2e:cas_capacity_change"]
    status: independently verified
    evidence_paths: ["e2e/concurrency.spec.ts", "src/app/resetAndInterrupt.test.tsx", "verification/D1_D2_INDEPENDENT_REVIEW.md"]
    note: "D1, N2 (stale slider resync) and N3 (narrow pending-intent race) all found and fixed; independently re-verified the same way as CAS-INT-001."
  - id: CAS-INT-006
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-006"
    given: "a fault scenario with at least 2 candidate restoration sequences"
    when: "a user chooses a restoration sequence"
    then: "served energy is ranked and a comparison animation shows the alternatives"
    behavior: "compare restoration"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:restoration_ranking", "e2e:cas_restoration_compare"]
    status: unstarted
    evidence_paths: []
  - id: CAS-INT-007
    project: "CASCADIA"
    priority: P1
    source: "Creative Engineering Atlas dossier p.7, interaction 1 (\"Disable a line\"); not covered by any contract ID, proposed and user-approved during CASCADIA planning pass"
    given: "baseline fixture loaded"
    when: "a user disables a transmission line (distinct from INT-001 node removal and INT-005 capacity change)"
    then: "islands/flow are recalculated and affected regions are visually darkened"
    behavior: "line outage"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:island_balance", "e2e:newControls.spec.ts"]
    status: implemented
    evidence_paths: ["src/app/newControls.test.tsx", "e2e/newControls.spec.ts"]
    note: "Covered by D2 and N1 tests specific to this control (line 33's outage, infeasible with shedding disallowed) plus an N2 trigger role. No test races setLineOutage itself (no D1 coverage for this control). Two instances of the same focus-management bug found and fixed: Escape-to-cancel, and the Cancel/trigger-button round trip, both silently did nothing for a keyboard user because the relevant button never received focus after the other one unmounted (browser dropped focus to <body>), so the section's onKeyDown handler never saw the event. Not yet independently reviewed."

  # --- Acceptance gates (source of truth: the Atlas's own executable contract table) ---
  - id: CAS-DATA-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88"
    given: "the case30 fixture and its provenance chain"
    when: "the dataset-verification skill is run"
    then: "source/license review is documented, schema is validated, a fixture checksum exists, and the reference calculator's test suite passes"
    behavior: "Source/license review; schema; fixture checksum; reference calculator test."
    owner: "data-engineer + data-ai-engineer"
    verification: ["manual:dataset-verification skill output", "unit:oracle test suite"]
    status: implemented
    evidence_paths: ["specifications/DATA_CONTRACT.yaml", "research/tests/test_oracle.py", "public/data/provenance/manifest.json"]
    note: "Schema/checksum/test-suite confirmed independently (15/15 pytest re-run by orchestrator). License review has one open TODO: the underlying UW/IEEE benchmark's own license text (not pandapower's, which is confirmed BSD-3) was not located, flagged honestly in DATA_CONTRACT.yaml rather than assumed. Not yet 'independently verified' pending that TODO."
  - id: CAS-MATH-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88"
    given: "the island-aware DC-OPF oracle implementation"
    when: "the N-1 parity sweep and boundary/infeasible-case tests run"
    then: "the Python oracle and the independent pandapower cross-check agree on feasible cases, and boundary/infeasible cases produce the documented diagnostic, not a silent failure"
    behavior: "Independent numerical baseline, boundary and infeasible-case agreement."
    owner: "data-ai-engineer, independently re-verified by qa-engineer"
    verification: ["unit:n1_parity_sweep", "unit:boundary_cases", "unit:infeasible_cases"]
    status: independently verified
    evidence_paths: ["verification/REFERENCE_RESULTS/n1_sweep.json", "verification/REFERENCE_RESULTS/pandapower_crosscheck.json", "verification/REFERENCE_RESULTS/ts_python_parity.json", "research/tests/test_oracle.py", "verification/D1_D2_INDEPENDENT_REVIEW.md"]
    note: "Python oracle: 195/195 N-1 sweep cases pass invariants, max per-island balance 2.8e-14 MW, pandapower cross-check agrees to 9.6e-13 MW. TS Worker vs Python oracle: 195/195 parity (max objective/shed relative delta ~8e-15). Independent per-bus balance check (not the engine's own field): 198/198, worst 7.5e-13 MW. All re-confirmed by a separate adversarial-reviewer session after the N1/N2/N3 fixes, which re-derived every number itself rather than trusting this file."
  - id: CAS-UX-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88"
    given: "the production build"
    when: "qa-engineer runs the full interaction test suite"
    then: "all 6 P0 controls work with keyboard/touch/reset parity, recorded as e2e tests"
    behavior: "Six working controls + keyboard/touch/reset, recorded e2e tests."
    owner: "qa-engineer"
    verification: ["e2e: all CAS-INT-00N tests"]
    status: in progress
    evidence_paths: ["e2e/cas_substation_remove_keyboard.spec.ts", "e2e/concurrency.spec.ts"]
    note: "2 of 6 P0 controls (CAS-INT-001, CAS-INT-005) built, keyboard-tested, and independently adversarially reviewed -- prototype scope, see docs/planning/cascadia/PROTOTYPE_ACCEPTANCE_CRITERIA.md. CAS-INT-002/003/004/007 now implemented with e2e coverage (e2e/newControls.spec.ts, e2e/addLine.spec.ts); CAS-INT-004's control (AddLine.tsx, button list, no <select>) is fully keyboard-only tested with no tooling caveat. CAS-INT-006 still unstarted at the UI level. Known tooling gap for the <select>-based controls, confirmed directly (not assumed): headless Chromium does not change a native <select>'s value in response to synthetic ArrowDown or typeahead key events (Playwright's own docs recommend selectOption for this reason), so those tests use selectOption for the <select> itself and real keyboard for every slider/checkbox/button -- a native select IS keyboard-operable for a real user via the browser's own OS-rendered dropdown, this is a test-tool constraint, not an app accessibility gap, but it means e2e cannot independently prove select-element keyboard operability the way it proves every other control element. This gate cannot move past 'in progress' until all 6 P0 controls exist."
