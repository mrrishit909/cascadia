requirements:
  # --- P0/P1 interaction requirements (source of truth: the Atlas's own execution contract) ---
  - id: CAS-INT-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-001"
    given: "baseline fixture (case30) loaded"
    when: "a user selects a substation and confirms removal"
    then: "the substation is marked unavailable, feasible service is recomputed via the island-aware DC-OPF, unserved load (MW) is shown from the solver output, an infeasible diagnostic is exposed when applicable, and undo restores the exact baseline"
    behavior: "Remove node"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:island_balance", "unit:n1_parity_sweep", "e2e:cas_substation_remove_keyboard"]
    status: independently verified
    evidence_paths: ["e2e/cas_substation_remove_keyboard.spec.ts", "e2e/concurrency.spec.ts", "src/app/resetAndInterrupt.test.tsx", "verification/D1_D2_INDEPENDENT_REVIEW.md"]
    note: "D1 (confirmed removal lost to a cross-control race) and N1 (allow_shed not honored) both found and fixed; independently re-verified by a separate adversarial-reviewer session that reproduced the original bugs against a pre-fix build to confirm its own harness, then confirmed neither reproduces on current code."
  - id: CAS-INT-002
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-002"
    given: "baseline fixture loaded"
    when: "a user raises load at a bus"
    then: "the dispatch LP is resolved, line thickness/color reflects the new flow, and infeasible load levels show a diagnostic instead of a silently-clamped number"
    behavior: "increase load"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:n1_parity_sweep", "unit:load_gen_sweep", "e2e:newControls.spec.ts"]
    status: implemented
    evidence_paths: ["src/app/newControls.test.tsx", "tests/unit/loadGenParity.test.ts", "verification/REFERENCE_RESULTS/load_gen_sweep.json", "e2e/newControls.spec.ts"]
    note: "40-case oracle sweep (8 forcing partial shed, including one cross-control case with CAS-INT-005) parity-verified against the TS Worker. Two real bugs found and fixed: a reintroduced N2-class draft-resync bug, and a select-then-slider race where an immediately-following slider edit could be silently reverted by the selection-change resync effect -- reproduced directly in ReduceGenerator.tsx. D1/N1 ordering and allowShed-threading also directly verified (e2e/newControls.spec.ts). Independently reviewed (verification/M4_WAVE1_INDEPENDENT_REVIEW.md): no P0/P1 found; confirmed IncreaseLoad's by-analogy fix (0/20 in two conditions, previously unverified there) and found the correct race mechanism (any rapid, self-perturbing loop reproduces it 15/15 with no concurrent control needed; the AlterCapacity checkbox used in this repo's own tests was incidental, not causal, contrary to this note's prior wording)."
  - id: CAS-INT-003
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-003"
    given: "baseline fixture loaded"
    when: "a user reduces a generator's output limit"
    then: "dispatch is recomputed and load-shed markers appear if the remaining capacity cannot serve demand"
    behavior: "reduce generator"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:n1_parity_sweep", "unit:load_gen_sweep", "e2e:newControls.spec.ts"]
    status: implemented
    evidence_paths: ["src/app/newControls.test.tsx", "tests/unit/loadGenParity.test.ts", "verification/REFERENCE_RESULTS/load_gen_sweep.json", "e2e/newControls.spec.ts"]
    note: "Same N2-class fix and sweep coverage as CAS-INT-002. The select-slider race was reproduced and fixed HERE (ReduceGenerator.tsx), not in IncreaseLoad.tsx -- see CAS-INT-002's note. Mutation-checked against the regression test's actual (not vacuous) shape: reverting the fix reproduces the race 20/20 against the current strengthened test (an earlier, weaker, since-superseded probe got 3/10 -- this note previously misattributed that number to the current test, corrected after the independent review caught it). Independently reviewed (verification/M4_WAVE1_INDEPENDENT_REVIEW.md): no P0/P1 found."
  - id: CAS-INT-004
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-004"
    given: "baseline fixture loaded"
    when: "a user adds a new transmission line between two buses (from a labeled-synthetic candidate list)"
    then: "the graph is recomputed and new routing/flow is shown"
    behavior: "add line"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:add_line_restoration_parity", "e2e:addLine.spec.ts"]
    status: independently verified
    evidence_paths: ["src/interactions/AddLine.tsx", "tests/unit/addLineRestorationParity.test.ts", "verification/REFERENCE_RESULTS/add_line_restoration.json", "e2e/addLine.spec.ts", "verification/M4_INT004_006_INDEPENDENT_REVIEW.md"]
    note: "Worker plumbing extended (LpRequest/lpClient/lpWorker/state.tsx) to carry the 5 SYNTHETIC candidate lines end to end, not just in the Python oracle/TS engine. 24-case oracle parity (add_line_restoration.json, part of the same file as INT-006's restoration ranking). Rendered in NetworkView.tsx as a distinct accent color, click/keyboard-toggleable directly from the SVG or the control's own list. A real bug found and fixed: the SVG toggle handler read confirmed-only state, so a second click while an add/remove was still in flight re-submitted the same direction instead of reversing it. Independently reviewed (verification/M4_INT004_006_INDEPENDENT_REVIEW.md): no P0/P1 found; the fix was stress-tested with a 90-combination adversarial timing probe (3 WASM delays x 6 inter-click waits x 5 reps) -- 56/90 reproduced the bug against pre-fix code, 0/90 against the fix, a materially wider envelope than this repo's own 10/10 mutation check. Two novel add-line scenarios (not in any existing test) independently computed via the oracle and confirmed matching the live UI. No dedicated D1 (genuine overlap) test yet for this control."
  - id: CAS-INT-005
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-005"
    given: "baseline fixture loaded"
    when: "a user alters a line's thermal capacity"
    then: "the constraint-binding status is recalculated and affected edges are visually refreshed"
    behavior: "alter line capacity"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:n1_parity_sweep", "e2e:cas_capacity_change"]
    status: independently verified
    evidence_paths: ["e2e/concurrency.spec.ts", "src/app/resetAndInterrupt.test.tsx", "verification/D1_D2_INDEPENDENT_REVIEW.md"]
    note: "D1, N2 (stale slider resync) and N3 (narrow pending-intent race) all found and fixed; independently re-verified the same way as CAS-INT-001. A separate defect (N4/D6: switching the selected line within the 250ms debounce window silently drops the pending capacity change, posting zero Worker requests) was found by the original D1/D2 review and is CONFIRMED STILL OPEN by the M4-wave independent review (verification/M4_WAVE1_INDEPENDENT_REVIEW.md), reproduced 5/5 -- pre-existing, not introduced by any M4 work, not yet fixed."
  - id: CAS-INT-006
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88, CAS-INT-006"
    given: "a fault scenario with at least 2 candidate restoration sequences"
    when: "a user chooses a restoration sequence"
    then: "served energy is ranked and a comparison animation shows the alternatives"
    behavior: "compare restoration"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:add_line_restoration_parity", "e2e:compareRestoration.spec.ts"]
    status: implemented
    evidence_paths: ["src/interactions/CompareRestoration.tsx", "tests/unit/addLineRestorationParity.test.ts", "verification/REFERENCE_RESULTS/add_line_restoration.json", "e2e/compareRestoration.spec.ts", "verification/M4_INT004_006_INDEPENDENT_REVIEW.md"]
    note: "4 hardcoded preset fault scenarios, mirroring research/evaluate/add_line_restoration.py's RESTORE dict exactly (k=2/3/3/5 down-elements, 2/6/6/120 orders) -- independent review confirmed a character-for-character match (bus/line IDs, not just counts) against the Python dict, and byte-identical regeneration of the reference JSON. Gets its OWN private Worker/lpClient, NOT the shared one in state.tsx: confirmed directly (mutation check) that sharing the queue makes a rank() query silently hang an unrelated control's in-flight solve forever (SupersededError swallowed without clearing solve/pending) -- a real D1-class bug avoided by isolation, not a hypothetical; independently re-confirmed with its own reproduction of the shared-queue hang against the real lpClient.ts code, and confirmed no code path falls back to the shared client. Worker termination on unmount is mechanically correct but currently unreachable in the shipped app (CompareRestoration is always mounted, never conditionally rendered) -- flagged as untested-in-situ, not a live leak. Keyboard operability independently confirmed end to end (select->Tab->Compare->Enter->Tab->choose order); a dedicated e2e test for this now exists. Analytical/UI portion independently reviewed (verification/M4_INT004_006_INDEPENDENT_REVIEW.md): no P0/P1 found. The 'then' clause's \"comparison animation\" is NOT met -- this ships a ranked list + chosen-order detail (serving energy ranked, a sequence chosen) but no animation; that is M4's motion pass, not yet started. Status reflects the analytical/UI portion only."
  - id: CAS-INT-007
    project: "CASCADIA"
    priority: P1
    source: "Creative Engineering Atlas dossier p.7, interaction 1 (\"Disable a line\"); not covered by any contract ID, proposed and user-approved during CASCADIA planning pass"
    given: "baseline fixture loaded"
    when: "a user disables a transmission line (distinct from INT-001 node removal and INT-005 capacity change)"
    then: "islands/flow are recalculated and affected regions are visually darkened"
    behavior: "line outage"
    owner: "data-ai-engineer (oracle) + frontend-engineer (control)"
    verification: ["unit:island_balance", "e2e:newControls.spec.ts"]
    status: implemented
    evidence_paths: ["src/app/newControls.test.tsx", "e2e/newControls.spec.ts"]
    note: "Covered by D2 and N1 tests specific to this control (line 33's outage, infeasible with shedding disallowed) plus an N2 trigger role. No test races setLineOutage itself (no D1 coverage for this control). Two instances of the same focus-management bug found and fixed: Escape-to-cancel, and the Cancel/trigger-button round trip, both silently did nothing for a keyboard user because the relevant button never received focus after the other one unmounted (browser dropped focus to <body>), so the section's onKeyDown handler never saw the event. Independently reviewed (verification/M4_WAVE1_INDEPENDENT_REVIEW.md): both focus fixes held up. AddLine/CompareRestoration (built after this review's scope was fixed) still need their own independent pass."

  # --- Acceptance gates (source of truth: the Atlas's own executable contract table) ---
