    when: "the dataset-verification skill is run"
    then: "source/license review is documented, schema is validated, a fixture checksum exists, and the reference calculator's test suite passes"
    behavior: "Source/license review; schema; fixture checksum; reference calculator test."
    owner: "data-engineer + data-ai-engineer"
    verification: ["manual:dataset-verification skill output", "unit:oracle test suite"]
    status: implemented
    evidence_paths: ["specifications/DATA_CONTRACT.yaml", "research/tests/test_oracle.py", "public/data/provenance/manifest.json"]
    note: "Schema/checksum/test-suite confirmed independently (15/15 pytest re-run by orchestrator). License review has one open TODO: the underlying UW/IEEE benchmark's own license text (not pandapower's, which is confirmed BSD-3) was not located, flagged honestly in DATA_CONTRACT.yaml rather than assumed. Not yet 'independently verified' pending that TODO."
  - id: CAS-MATH-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88"
    given: "the island-aware DC-OPF oracle implementation"
    when: "the N-1 parity sweep and boundary/infeasible-case tests run"
    then: "the Python oracle and the independent pandapower cross-check agree on feasible cases, and boundary/infeasible cases produce the documented diagnostic, not a silent failure"
    behavior: "Independent numerical baseline, boundary and infeasible-case agreement."
    owner: "data-ai-engineer, independently re-verified by qa-engineer"
    verification: ["unit:n1_parity_sweep", "unit:boundary_cases", "unit:infeasible_cases"]
    status: independently verified
    evidence_paths: ["verification/REFERENCE_RESULTS/n1_sweep.json", "verification/REFERENCE_RESULTS/pandapower_crosscheck.json", "verification/REFERENCE_RESULTS/ts_python_parity.json", "research/tests/test_oracle.py", "verification/D1_D2_INDEPENDENT_REVIEW.md"]
    note: "Python oracle: 195/195 N-1 sweep cases pass invariants, max per-island balance 2.8e-14 MW, pandapower cross-check agrees to 9.6e-13 MW. TS Worker vs Python oracle: 195/195 parity (max objective/shed relative delta ~8e-15). Independent per-bus balance check (not the engine's own field): 198/198, worst 7.5e-13 MW. All re-confirmed by a separate adversarial-reviewer session after the N1/N2/N3 fixes, which re-derived every number itself rather than trusting this file."
  - id: CAS-UX-001
    project: "CASCADIA"
    priority: P0
    source: "Creative Engineering Atlas executable contract p.88"
    given: "the production build"
    when: "qa-engineer runs the full interaction test suite"
    then: "all 6 P0 controls work with keyboard/touch/reset parity, recorded as e2e tests"
    behavior: "Six working controls + keyboard/touch/reset, recorded e2e tests."
    owner: "qa-engineer"
    verification: ["e2e: all CAS-INT-00N tests"]
    status: in progress
    evidence_paths: ["e2e/cas_substation_remove_keyboard.spec.ts", "e2e/concurrency.spec.ts"]
    note: "All 6 P0 controls now implemented (CAS-INT-001 through 006), plus CAS-INT-007 (P1), and every one of the 7 independently adversarially reviewed (verification/D1_D2_INDEPENDENT_REVIEW.md, verification/M4_WAVE1_INDEPENDENT_REVIEW.md, verification/M4_INT004_006_INDEPENDENT_REVIEW.md): no P0/P1 found anywhere; see each row's own note for specifics, including the two still-open pre-existing P2s (AlterCapacity's N4/D6 quick-line-switch drop, CAS-INT-005's note) this review surfaced or re-confirmed. CompareRestoration's missing keyboard-only test (flagged by the first pass) is now closed. Known tooling gap for the <select>-based controls, confirmed directly in BOTH headless and headed Chromium (not assumed): neither changes a native <select>'s value in response to synthetic ArrowDown or typeahead key events (Playwright's own docs recommend selectOption for this reason; true OS-level hardware input was not tested either way), so those tests use selectOption for the <select> itself and real keyboard for every slider/checkbox/button -- a native select IS keyboard-operable for a real user via the browser's own OS-rendered dropdown, this is a test-tool constraint, not an app accessibility gap, but it means e2e cannot independently prove select-element keyboard operability the way it proves every other control element. Still open: no touch/tap e2e coverage exists for any control yet (CAS-UX-001 requires touch parity) -- this is the one remaining item blocking this gate from moving past 'in progress', along with CAS-INT-006's missing comparison animation."
